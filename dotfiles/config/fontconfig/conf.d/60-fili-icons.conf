<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Icônes fines de l'interface (fili-bar, fili-notification, fili-launcher): derrière Jost, « Fili Icons »
     (Lucide sur les codes Font Awesome, scripts/fili-icons.py) passe avant Font Awesome et les Nerd Fonts.
     Limité à Jost: le terminal (JetBrains Mono) garde les icônes Nerd Font. -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>Jost</string></test>
    <edit name="family" mode="append" binding="strong"><string>Fili Icons</string></edit>
  </match>
</fontconfig>
