<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Une seule police d'interface (hig.md, Typographie): Jost devient la police sans-serif et system-ui du système, pour
     que les applications tierces (Chrome, GTK, Qt) qui suivent fontconfig s'accordent au fili-shell. Les sites et
     applications qui demandent une police précise la gardent; le code et les terminaux sont en JetBrains Mono (monospace). -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Jost</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Jost</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
