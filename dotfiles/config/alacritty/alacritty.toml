# Filigrane (brand.md), mêmes couleurs que foot
[font]
size = 9

[font.normal]
family = "JetBrains Mono"

[window]
padding = { x = 10, y = 10 }

[selection]
# Sélectionner du texte le copie aussi dans le presse-papiers (Ctrl+V / Ctrl+Shift+V)
save_to_clipboard = true

[colors.primary]
background = "#1c222b"
foreground = "#dbe7f4"
dim_foreground = "#a9b8c8"
bright_foreground = "#dbe7f4"

[colors.cursor]
text = "#1c222b"
cursor = "#9dbbd6"

[colors.vi_mode_cursor]
text = "#1c222b"
cursor = "#b9d0e4"

[colors.search.matches]
foreground = "#1c222b"
background = "#a9b8c8"

[colors.search.focused_match]
foreground = "#1c222b"
background = "#9dbbd6"

[colors.footer_bar]
foreground = "#1c222b"
background = "#a9b8c8"

[colors.hints.start]
foreground = "#1c222b"
background = "#d2bf92"

[colors.hints.end]
foreground = "#1c222b"
background = "#a9b8c8"

[colors.selection]
text = "#dbe7f4"
background = "#3c4858"

[colors.normal]
black = "#2d3744"
red = "#c98f93"
green = "#a3bfa8"
yellow = "#d2bf92"
blue = "#9dbbd6"
magenta = "#b3a8c9"
cyan = "#95c0c6"
white = "#a9b8c8"

[colors.bright]
black = "#5f7894"
red = "#d9a5a9"
green = "#b8d0bc"
yellow = "#e0d0a8"
blue = "#b9d0e4"
magenta = "#c6bdd8"
cyan = "#add2d7"
white = "#dbe7f4"
