# Le FileChooser de xdg-desktop-portal-gnome exige Nautilus (non installé):
# sans lui, Chromium annule les téléchargements « Enregistrer sous ». On passe par gtk.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
# fili-file répond aux Ouvrir / Enregistrer (Chrome...), le dialogue gtk en secours
org.freedesktop.impl.portal.FileChooser=filigrane;gtk;
