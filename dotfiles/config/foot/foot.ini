# Filigrane (brand.md): fond nuit, texte brume, accent voile, couleurs d'état désaturées. Mode clair (fili-theme):
# papier, texte nuit, accent ardoise, états assombris. fili-theme bascule les fenêtres ouvertes (SIGUSR1/SIGUSR2)
[main]
# Thème des nouvelles fenêtres (initial-color-theme) et curseur à la couleur d'accent, écrits par fili-theme
include=~/.config/foot/theme.ini
font=JetBrains Mono:pixelsize=12
pad=10x10
# Pas de threads de rendu supplémentaires (moins de RAM et de CPU)
workers=0
# Sélectionner du texte le copie aussi dans le presse-papiers (Ctrl+V / Ctrl+Shift+V)
selection-target=both

