[key-bindings]
# Copier/coller universels (Cmd+C/V via keyd, voir hardware/mac-t2/keyd.conf), comme Omarchy
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
primary-paste=none
