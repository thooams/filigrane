# Filigrane (brand.md): fond nuit, texte brume, accent voile, couleurs d'état désaturées
[main]
font=JetBrains Mono:size=11
pad=10x10
# Pas de threads de rendu supplémentaires (moins de RAM et de CPU)
workers=0
# Sélectionner du texte le copie aussi dans le presse-papiers (Ctrl+V / Ctrl+Shift+V)
selection-target=both

[colors-dark]
background=1c222b
foreground=dbe7f4
regular0=2d3744
regular1=c98f93
regular2=a3bfa8
regular3=d2bf92
regular4=9dbbd6
regular5=b3a8c9
regular6=95c0c6
regular7=a9b8c8
bright0=5f7894
bright1=d9a5a9
bright2=b8d0bc
bright3=e0d0a8
bright4=b9d0e4
bright5=c6bdd8
bright6=add2d7
bright7=dbe7f4
16=d2bf92
17=dbe7f4
selection-foreground=dbe7f4
selection-background=3c4858
cursor=1c222b 9dbbd6

[key-bindings]
# Copier/coller universels (Cmd+C/V via keyd, voir hardware/mac-t2/keyd.conf), comme Omarchy
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
primary-paste=none
