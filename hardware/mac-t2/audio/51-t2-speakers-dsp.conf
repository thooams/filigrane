# MacBook Pro 13" 2020 Intel (MacBookPro16,2): même châssis et mêmes 4 haut-parleurs que le
# MacBook Pro 13" M1 (j293). On applique le DSP d'Asahi (asahi-audio: FIR mesurés contre macOS,
# bankstown pour la basse, compensation de loudness, limiteurs LSP) sur la sortie T2.
# Installé par hardware/mac-t2/setup.sh (--only audio) uniquement sur ces modèles.
node.software-dsp.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Speaker__sink$" }
    ]
    actions = {
      create-filter = {
        filter-path = "/usr/share/t2-audio/speakers-j293.json"
        hide-parent = true
      }
    }
  }
]

# Le script software-dsp n'est pas chargé par défaut
wireplumber.profiles = {
  main = {
    node.software-dsp = required
  }
}
