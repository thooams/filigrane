# Mac T2: le casque passe avant les haut-parleurs quand il est branché.
# Le filtre "Speaker" (split UCM) a priority.session 1000, le casque 712: sans cette règle,
# la sortie reste sur les haut-parleurs. Casque débranché, sa route est indisponible et
# WirePlumber revient aux haut-parleurs.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 1100
        priority.driver  = 1100
      }
    }
  }
]
