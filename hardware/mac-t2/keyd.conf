# keyd: clavier interne US des Mac T2. Installé dans /etc/keyd/default.conf par hardware/mac-t2/setup.sh (--only keys).
# Aucun remappage: Command reste Super (touche Mod de niri), copier/coller = Ctrl+C/V. keyd garde le clavier
# capturé pour le pilote Touch Bar (appletb v2).

[ids]
# Clavier interne seul. Le trackpad a le même identifiant USB (05ac:027e) et keyd le classe
# aussi comme clavier (boutons): le capturer casse le multitouch. Le 3e champ (voir `keyd monitor`)
# est calculé par keyd à partir des capacités et du nom du périphérique, stable entre démarrages:
# f2d1f5c2 = clavier, c772a57c = trackpad. À revérifier si le trackpad est de nouveau capturé.
k:05ac:027e:f2d1f5c2

[main]
