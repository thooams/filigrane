# keyd: touche Command comme sur macOS (clavier interne US des Mac T2, saisie en bépo AFNOR).
# Installé dans /etc/keyd/default.conf par hardware/mac-t2/setup.sh (--only keys).
#
# Cmd + touche = Ctrl + la lettre gravée sur la touche (position QWERTY du Mac), quelle que soit
# la disposition bépo: chaque touche physique est traduite vers celle qui donne cette lettre en
# bépo AFNOR. Maj reste active (Cmd+Maj+Z = Ctrl+Maj+Z).
# Copier/coller/couper passent par Ctrl+Inser / Maj+Inser / Maj+Suppr, compris aussi par les
# terminaux (foot), contrairement à Ctrl+C/V.
# Option (Alt gauche) reste Alt: c'est la touche Mod de niri.

[ids]
# Clavier interne seul. Le trackpad a le même identifiant USB (05ac:027e) et keyd le classe
# aussi comme clavier (boutons): le capturer casse le multitouch. Le 3e champ (voir `keyd monitor`)
# est calculé par keyd à partir des capacités et du nom du périphérique, stable entre démarrages:
# f2d1f5c2 = clavier, c772a57c = trackpad. À revérifier si le trackpad est de nouveau capturé.
k:05ac:027e:f2d1f5c2

[main]
leftmeta = layer(cmd)
rightmeta = layer(cmd)

# Touches non listées: Ctrl (modificateur de la couche)
[cmd:C]
c = C-insert
v = S-insert
x = S-delete

a = C-a
b = C-q
d = C-i
e = C-f
f = C-slash
g = C-comma
h = C-dot
i = C-d
j = C-p
k = C-b
l = C-o
m = C-apostrophe
n = C-semicolon
o = C-r
p = C-e
q = C-m
r = C-l
s = C-k
t = C-j
u = C-s
w = C-rightbrace
y = C-x
z = C-leftbrace

# Flèches comme sur Mac: début/fin de ligne, début/fin de document
left = home
right = end
up = C-home
down = C-end
