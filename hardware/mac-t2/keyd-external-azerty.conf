# keyd: touche Command façon macOS pour un clavier Mac AZERTY externe, saisie en bépo AFNOR.
# Installé dans /etc/keyd/external-azerty.conf par hardware/mac-t2/setup.sh (--only keys).
#
# Même logique que keyd.conf (clavier interne US), mais avec les lettres gravées AZERTY:
# Cmd + touche = Ctrl + la lettre gravée, traduite vers la touche qui la donne en bépo AFNOR.
# S'applique à tout clavier externe (le clavier interne est servi par keyd.conf).

[ids]
*
-05ac:027e

[main]
leftmeta = layer(cmd)
rightmeta = layer(cmd)

[cmd:C]
# AZERTY: C, V, X aux mêmes places qu'en QWERTY
c = C-insert
v = S-insert
x = S-delete

# rangée du haut: A Z E R T Y U I O P
q = C-a
w = C-leftbrace
e = C-f
r = C-l
t = C-j
y = C-x
u = C-s
i = C-d
o = C-r
p = C-e

# rangée du milieu: Q S D F G H J K L M
a = C-m
s = C-k
d = C-i
f = C-slash
g = C-comma
h = C-dot
j = C-p
k = C-b
l = C-o
semicolon = C-apostrophe

# rangée du bas: W X C V B N
z = C-rightbrace
b = C-q
n = C-semicolon

left = home
right = end
up = C-home
down = C-end
