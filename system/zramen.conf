# zramen (/etc/sv/zramen/conf): swap compressé en RAM, prioritaire sur le swapfile du SSD.
# zstd compresse ~3:1: 50 % de la RAM (plafond 8 Go) en zram n'occupe que ~2-3 Go une fois plein.
# Le swapfile /swap/swapfile reste en débordement (priorité -2), sans hibernation (nohibernate).
export ZRAM_COMP_ALGORITHM=zstd
export ZRAM_SIZE=50
export ZRAM_MAX_SIZE=8192
export ZRAM_PRIORITY=32767
export ZRAMEN_QUIET=1
