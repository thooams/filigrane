# iwd configure lui-même l'IP du Wi-Fi (DHCPv4, RA/DHCPv6, DNS via resolvconf).
# L'adresse suit chaque connexion: plus de bail périmé quand dhcpcd rate la coupure
# (reconnexion en moins d'une seconde à la sortie de veille, vers un autre réseau).
# dhcpcd ne gère plus que le filaire (denyinterfaces wl* dans /etc/dhcpcd.conf).
[General]
EnableNetworkConfiguration=true

[Network]
NameResolvingService=resolvconf
