# Durcissement léger pour un poste client (sans effet sur podman rootless ni sur le VPN)
# Journal noyau et adresses noyau réservés à root (dmesg: sudo)
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
# eBPF non privilégié refusé
kernel.unprivileged_bpf_disabled = 1
# Anti-usurpation d'adresse source, en mode lâche (2) pour ne pas gêner le VPN ni le multi-interfaces
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# Ni redirections ICMP acceptées, ni envoyées; pas de routage par la source
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.tcp_syncookies = 1

# Swap: zram (RAM compressée) en premier, swapfile SSD en débordement. Swapper en zram coûte
# peu: valeur haute pour libérer la RAM des pages inactives (défaut 60, 10 sans zram)
vm.swappiness = 100
