[package]
name = "fili-file"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
libc = "0.2.191"
zbus = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
cxx-qt-build = "0.10.0"
