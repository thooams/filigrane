name: CI

# Sur les pull requests vers main et sur les push vers main, develop et distro.
# Rien n'installe de système: on vérifie la logique de sélection
# (profil, machine, CPU, GPU, architecture), l'existence des paquets, la config niri et la pose des dotfiles.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop, distro]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe bash
        run: |
          for f in bootstrap.sh install-void.sh scripts/*.sh hardware/mac-t2/*.sh distro/*.sh distro/live/install users/*/layer.sh; do
            bash -n "$f"
          done
      - name: shellcheck (erreurs seulement)
        run: shellcheck -x -S error bootstrap.sh install-void.sh scripts/*.sh hardware/mac-t2/setup.sh hardware/mac-t2/dualboot.sh distro/*.sh distro/live/install users/*/layer.sh
      - name: shellcheck des scripts utilisateur (~/.local/bin, hooks; pas les scripts Python)
        run: |
          scripts=()
          for f in dotfiles/home/.local/bin/* dotfiles/home/.claude/hooks/*.sh; do
            head -1 "$f" | grep -qE '^#!(/bin/|/usr/bin/env )(ba)?sh' && scripts+=("$f")
          done
          shellcheck -x -S error "${scripts[@]}"
      - name: JSON valides (une erreur fait ignorer tout le fichier, sans message)
        run: |
          # hardware/*/audio: SPA-JSON de PipeWire (virgules finales admises), pas du JSON strict
          git ls-files '*.json' ':!:hardware/*/audio/*' | while read -r f; do
            jq empty "$f" || { echo "JSON invalide: $f"; exit 1; }
          done
      - name: Consignes et skills des agents
        run: |
          # CLAUDE.md importe AGENTS.md (une seule source pour Claude Code, Codex et opencode)
          for d in . agents/work; do
            grep -qx '@AGENTS.md' "$d/CLAUDE.md" && test -s "$d/AGENTS.md" || { echo "$d: CLAUDE.md doit importer AGENTS.md"; exit 1; }
          done
          for s in agents/skills/*/SKILL.md; do
            fm="$(awk 'NR==1 && $0=="---" {f=1; next} f && $0=="---" {exit} f' "$s")"
            grep -q '^name: ' <<<"$fm" && grep -q '^description: ' <<<"$fm" || { echo "frontmatter sans name ou description: $s"; exit 1; }
          done

  # niri validate sur la config de la distribution, puis avec la couche personnelle (local.kdl)
  niri:
    runs-on: ubuntu-24.04
    container: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - uses: actions/checkout@v4
      - name: niri (version du dépôt Void)
        run: |
          xbps-install -Syu xbps || true
          xbps-install -Sy niri
      - name: Validation
        run: |
          d="$(mktemp -d)"
          cp dotfiles/config/niri/config.kdl "$d/"
          niri validate -c "$d/config.kdl"
          for l in users/*/dotfiles/config/niri/local.kdl; do
            [ -f "$l" ] || continue
            cp "$l" "$d/local.kdl"
            niri validate -c "$d/config.kdl"
          done

  # Une ligne par configuration à valider: bootstrap.sh --plan doit résoudre toutes les listes
  plan:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: vm,                 args: "--profile vm --machine generic --cpu other --gpu none --arch x86_64" }
          - { name: pc-intel,           args: "--profile baremetal --machine generic --cpu intel --gpu intel --arch x86_64" }
          - { name: pc-amd-amd,         args: "--profile baremetal --machine generic --cpu amd --gpu amd --arch x86_64" }
          - { name: pc-amd-nvidia,      args: "--profile baremetal --machine generic --cpu amd --gpu nvidia --arch x86_64" }
          - { name: pc-hybride,         args: "--profile baremetal --machine generic --cpu intel --gpu intel,nvidia --arch x86_64" }
          - { name: mac-t2,             args: "--profile baremetal --machine mac-t2 --cpu intel --gpu intel --arch x86_64" }
          - { name: arm,                args: "--profile baremetal --machine generic --cpu other --gpu none --arch aarch64" }
          - { name: riscv,              args: "--profile baremetal --machine generic --cpu other --gpu none --arch riscv64" }
    steps:
      - uses: actions/checkout@v4
      - name: Plan (${{ matrix.name }})
        run: ./bootstrap.sh --plan ${{ matrix.args }}
      - name: Machine générique sans hardware/
        if: matrix.name != 'mac-t2'
        run: |
          out="$(./bootstrap.sh --plan ${{ matrix.args }})"
          if grep -qE '^hardware/mac-t2|mac-t2\.txt' <<<"$out"; then
            echo "mac-t2 ne doit pas apparaître hors de la machine mac-t2"; exit 1
          fi
      - name: Couche personnelle (users/thomas) résolue en plus de la distribution
        run: |
          out="$(./bootstrap.sh --plan ${{ matrix.args }} --user-layer thomas)"
          grep -qx 'users/thomas/packages/personal.txt' <<<"$out"
          grep -qx 'users/thomas' <<<"$out"
          if ./bootstrap.sh --plan ${{ matrix.args }} | grep -q '^users/'; then echo "couche personnelle hors --user-layer"; exit 1; fi
      - name: Options invalides refusées
        run: |
          for bad in "--machine inconnue" "--cpu arm" "--gpu inconnu" "--user-layer inconnue"; do
            # shellcheck disable=SC2086
            if ./bootstrap.sh --plan $bad >/dev/null 2>&1; then echo "accepté à tort: $bad"; exit 1; fi
          done

  # Les paquets des listes existent dans le dépôt Void de l'architecture
  packages:
    runs-on: ubuntu-24.04
    container: ghcr.io/void-linux/void-glibc-full:latest
    strategy:
      fail-fast: false
      matrix:
        # aarch64 est informatif: des paquets Intel ou propriétaires y manquent normalement
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: bash (absent de l'image)
        run: |
          xbps-install -Syu xbps || true
          xbps-install -Sy bash
      - run: bash scripts/check-packages.sh ${{ matrix.arch }} ${{ matrix.arch != 'x86_64' && '--warn-only' || '' }}

  # Pose des dotfiles dans un HOME vierge pour chaque machine: aucun lien cassé, fichiers T2 seulement sur mac-t2
  dotfiles:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        machine: [generic, mac-t2]
    steps:
      - uses: actions/checkout@v4
      - name: Dotfiles (${{ matrix.machine }})
        run: ./bootstrap.sh --dotfiles-only --profile baremetal --machine ${{ matrix.machine }} --cpu other --gpu none --arch x86_64
      - name: Liens cassés
        run: |
          broken="$(find "$HOME" -xdev -xtype l -not -path "$HOME/.cache/*" -not -path "$HOME/.local/state/*" 2>/dev/null || true)"
          [ -z "$broken" ] || { echo "$broken"; exit 1; }
      - name: Agent IA (skills, dossier de travail, fili-ai sans réseau)
        run: |
          for d in .claude/skills .agents/skills; do test -f "$HOME/$d/filigrane/SKILL.md"; done
          for f in AGENTS.md CLAUDE.md; do test -f "$HOME/work/$f"; done
          conf="$HOME/.config/filigrane/ai.env"
          grep -qx 'FILI_AI=claude' "$conf"
          fili="$HOME/.local/bin/fili-ai"
          "$fili" status
          "$fili" use none
          grep -qx 'FILI_AI=none' "$conf"
          if "$fili" use inconnu; then echo "agent inconnu accepté"; exit 1; fi
          if "$fili" </dev/null; then echo "lancé sans agent"; exit 1; fi
      - name: Fichiers T2
        run: |
          t2="$HOME/.config/t2-audio/tune.conf"
          if [ "${{ matrix.machine }}" = mac-t2 ]; then
            test -e "$t2"
          else
            test ! -e "$t2"
          fi
      - name: Idempotence
        run: ./bootstrap.sh --dotfiles-only --profile baremetal --machine ${{ matrix.machine }} --cpu other --gpu none --arch x86_64
